name: Hamurabi
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hamurabi:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      # Icon Composer bundle; Xcode builds every icon size from it
      - path: Hamurabi.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hamurabi
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hamurabi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.strategy-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Hamurabi
        DEVELOPMENT_TEAM: QMM486NPYC
  HamurabiTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies: [{target: Hamurabi}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.hamurabi.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Hamurabi.app/Contents/MacOS/Hamurabi
schemes:
  Hamurabi:
    build: {targets: {Hamurabi: all, HamurabiTests: [test]}}
    test: {targets: [HamurabiTests]}
    shared: true
